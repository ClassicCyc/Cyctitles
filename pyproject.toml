[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyctitles"
version = "1.0.0"
description = "Real-time offline subtitles and dictation for streamers (Whisper + CTranslate2)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "ClassicCyc" }]
keywords = ["subtitles", "speech-recognition", "whisper", "translation", "obs", "streaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "PySide6==6.12.0",
    "sounddevice==0.5.6",
    "soundcard==0.4.6",
    "numpy==2.5.4",
    "webrtcvad-wheels==2.0.14.post1",
    "faster-whisper==1.2.1",
    "ctranslate2==4.8.3",
    "sentencepiece==0.2.2",
    "huggingface-hub==2.2.0",
    "aiohttp==3.14.5",
]

[project.optional-dependencies]
gpu = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
    "nvidia-cuda-runtime-cu12",
    "nvidia-cuda-nvrtc-cu12",
]
dev = [
    "pytest",
    "pyinstaller==6.22.3",
    "pyinstaller-hooks-contrib",
    "Pillow",
]

[project.urls]
Homepage = "https://github.com/ClassicCyc/Cyctitles"
Source = "https://github.com/ClassicCyc/Cyctitles"
Telegram = "https://t.me/classiccyc"
YouTube = "https://youtube.com/@ClassicCyc"

[tool.setuptools]
packages = ["cyctitles", "cyctitles.ui"]

[tool.setuptools.package-data]
cyctitles = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
